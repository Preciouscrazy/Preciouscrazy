<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-labelledby="title">
  <title id="title">Adobe InDesign icon</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#532363"/>
      <stop offset="1" stop-color="#24112F"/>
    </linearGradient>
    <linearGradient id="letters" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF8FE0"/>
      <stop offset="1" stop-color="#F04BC2"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="9" fill="url(#tile)"/>
  <text x="32" y="44" text-anchor="middle" fill="url(#letters)" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" letter-spacing="-2">Id</text>
</svg>
