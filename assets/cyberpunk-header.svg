<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Precious cyberpunk profile banner</title>
  <desc id="desc">A dark violet futuristic skyline with cyan and magenta neon accents.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090714"/>
      <stop offset=".55" stop-color="#15102a"/>
      <stop offset="1" stop-color="#080b19"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b36bff"/>
      <stop offset=".52" stop-color="#65f5ff"/>
      <stop offset="1" stop-color="#ff4fd8"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#8a42d8" stop-opacity=".38"/>
      <stop offset="1" stop-color="#8a42d8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#9c76cf" stroke-opacity=".10" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>
  <rect width="1200" height="300" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="22" fill="url(#grid)"/>
  <ellipse cx="940" cy="95" rx="315" ry="190" fill="url(#glow)"/>
