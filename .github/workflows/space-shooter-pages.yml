name: Deploy space shooter to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - "space-shooter/**"
      - ".github/scripts/create_space_shooter_preview.py"
      - ".github/workflows/space-shooter-pages.yml"
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Set up Python for the profile preview
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate animated profile preview
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_LOGIN: ${{ github.repository_owner }}
        run: |
          python -m pip install --disable-pip-version-check pillow
          python .github/scripts/create_space_shooter_preview.py --output space-shooter/space-shooter-heatmap.gif
      - name: Upload game page
        uses: actions/upload-pages-artifact@v3
        with:
          path: space-shooter
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
