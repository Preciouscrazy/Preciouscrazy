name: Deploy space shooter to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - "space-shooter/**"
      - ".github/workflows/space-shooter-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload game page
        uses: actions/upload-pages-artifact@v3
        with:
          path: space-shooter
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
